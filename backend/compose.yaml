services:
  mysql:
    image: mysql:8.4
    container_name: planificateur-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: planificateur-itineraires
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - planificateur_db:/var/lib/mysql

volumes:
  planificateur_db: